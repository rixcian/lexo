# Paste this into Portainer: Stacks -> Add stack -> Web editor.
#
# It pulls a prebuilt image from GHCR, so the server never has to build
# anything. The image is published by .github/workflows/docker-publish.yml on
# every push to main.
#
# Set TZ in Portainer's "Environment variables" section (or edit it here) - the
# study day rolls over at 04:00 in that timezone and streaks depend on it.

services:
  lexo:
    # `latest` tracks the newest release tag, not main. Pin a version
    # (ghcr.io/rixcian/lexo:0.1.0) if you would rather upgrade deliberately.
    image: ghcr.io/rixcian/lexo:latest
    container_name: lexo
    restart: unless-stopped
    ports:
      # Reachable from the LAN and from the tailnet. The app has no login, so
      # narrow this to "127.0.0.1:3000:3000" and proxy it if the host ever gets
      # an interface you do not trust.
      - "${LEXO_BIND:-0.0.0.0}:3000:3000"
    environment:
      TZ: ${TZ:-Europe/Prague}
      ANKI_DB_PATH: /data/anki.db
    volumes:
      # Your whole collection is one SQLite file inside this volume.
      - lexo-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  lexo-data:
